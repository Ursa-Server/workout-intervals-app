<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="A simple, powerful workout interval timer.">

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>Intervals</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- App Container -->
    <main id="app">

        <!-- View 1: Dashboard / Routine Loader -->
        <section id="view-dashboard" class="view active">
            <header>
                <h1>Intervals</h1>
                <button id="btn-show-calendar" class="icon-btn" aria-label="View History">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </button>
            </header>

            <div class="content-padded">
                <div class="card">
                    <h2>Select Routine</h2>
                    <select id="routine-select" class="input-modern">
                        <option value="" disabled selected>Load a saved routine...</option>
                    </select>

                    <div class="input-group">
                        <button id="btn-start-selected" class="btn btn-primary" disabled>Start Selected</button>
                        <button id="btn-delete-selected" class="btn btn-secondary"
                            style="background-color: var(--accent-danger); color: white;" disabled>Delete</button>
                    </div>

                    <h2 style="margin-top: 20px;">Voice Selection</h2>
                    <select id="voice-select" class="input-modern" style="margin-bottom: 20px;">
                        <option value="default">Default Automatic Female Mode</option>
                    </select>

                    <button id="btn-start-selected" class="btn btn-primary" disabled>Start Selected</button>
                </div>

                <div class="card">
                    <h2>Paste Custom JSON</h2>
                    <p class="helper-text">Format: [{ "time": 30, "instruction": "Pushups" }]</p>
                    <textarea id="routine-json" class="input-modern" rows="5"
                        placeholder="Paste JSON here..."></textarea>

                    <div class="input-group">
                        <input type="text" id="routine-name" class="input-modern" placeholder="Routine Name (to save)">
                        <button id="btn-save-json" class="btn btn-secondary">Save</button>
                    </div>
                    <button id="btn-start-json" class="btn btn-primary">Start Custom</button>
                </div>
            </div>
        </section>

        <!-- View 2: Active Workout Timer -->
        <section id="view-workout" class="view">
            <div class="workout-header">
                <button id="btn-cancel-workout" class="icon-btn" aria-label="Cancel Workout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="workout-progress" id="workout-progress">1 / 10</div>
            </div>

            <div class="timer-container">
                <!-- Large Countdown Timer -->
                <div id="time-display" class="time-display">00:00</div>

                <!-- Current Instruction -->
                <div id="instruction-display" class="instruction-display">Get Ready</div>
            </div>

            <div class="up-next-container">
                <span class="up-next-label">UP NEXT</span>
                <div id="next-instruction-display" class="next-instruction-display">...</div>
            </div>

            <div class="total-time-container">
                <span class="up-next-label">TOTAL TIME REMAINING</span>
                <div id="total-time-display" class="total-time-display">00:00</div>
            </div>

            <div class="workout-controls">
                <button id="btn-pause-resume" class="btn btn-large btn-primary">Pause</button>
            </div>
        </section>

        <!-- View 3: History / Calendar -->
        <section id="view-calendar" class="view">
            <header>
                <button id="btn-back-dashboard" class="icon-btn" aria-label="Back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <h1>History</h1>
            </header>

            <div class="content-padded">
                <div class="calendar-wrapper card">
                    <div class="calendar-header">
                        <button id="btn-cal-prev" class="icon-btn">&lt;</button>
                        <h2 id="cal-month-year">Month Year</h2>
                        <button id="btn-cal-next" class="icon-btn">&gt;</button>
                    </div>
                    <div class="calendar-grid" id="calendar-grid">
                        <!-- Calendar days injected via JS -->
                    </div>
                </div>

                <div class="history-logs">
                    <h2>Recent Workouts</h2>
                    <ul id="log-list" class="log-list">
                        <!-- Logs injected via JS -->
                    </ul>
                </div>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/workout.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
